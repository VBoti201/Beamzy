name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'updates/**'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run build:win

      - uses: actions/upload-artifact@v4
        with:
          name: SwiftSend-windows
          path: |
            dist/*.exe
          if-no-files-found: error

      # Publish the update feed (installer + latest.yml + blockmap) to the
      # updates/ folder on main, which the Render static site serves. This
      # is what electron-updater checks against for auto-updates. Only
      # touches this platform's own files — the macOS workflow publishes
      # into the same folder in parallel, so we must not wipe it wholesale.
      - name: Publish update feed
        shell: bash
        run: |
          mkdir -p updates
          node scripts/inject-release-notes.js dist/latest.yml "$(git log -1 --pretty=%B)"
          rm -f updates/*.exe updates/latest.yml updates/*.exe.blockmap
          # Only the NSIS installer + its metadata belong in the update feed
          # (the portable build isn't something electron-updater manages).
          cp dist/*Setup*.exe updates/
          cp dist/latest.yml updates/
          cp dist/*.blockmap updates/
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates/
          if git diff --cached --quiet; then
            echo "No update feed changes"
          else
            git commit -m "Publish Windows update feed for $(node -p "require('./package.json').version") [skip ci]"
            # The commit above only needs to happen once — from here it's
            # purely about getting it pushed, retrying with a rebase if the
            # macOS job's own publish commit landed first. Re-running the
            # add/diff/commit logic after a successful rebase would find
            # nothing staged (the change is already committed, just not
            # pushed yet) and skip the push entirely, silently dropping
            # this platform's update.
            for i in 1 2 3 4 5; do
              if git push; then
                break
              fi
              echo "Push rejected (probably the macOS job pushed first) — rebasing and retrying..."
              git fetch origin main
              git rebase origin/main
            done
          fi
