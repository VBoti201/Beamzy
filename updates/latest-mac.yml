releaseNotes: |-
  Fix app icon looking oversized next to native macOS apps

  The icon's rounded-square shape filled the entire canvas edge to edge;
  Apple's own apps leave the shape at roughly 80% of the canvas so it reads
  at the same visual size as everything else in the Dock and Finder.
  Rescaled both the dark and light variants down with transparent padding
  and rebuilt icon.icns from the corrected artwork — no other change to
  the design itself.
