releaseNotes: |-
  Add a script for the periodic update-history trim

  Documents and automates the git-filter-repo dance used to shrink .git
  back down (each release adds ~150-250MB of binaries under updates/
  that never get cleaned up otherwise). The final force-push is left to
  the user to run themselves — Claude Code won't run that unattended.
