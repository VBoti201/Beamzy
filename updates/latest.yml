releaseDate: '2026-08-26T14:14:34.680Z'
releaseNotes: |-
  Fix app failing to launch at all since 0.1.53 (ERR_REQUIRE_ESM on archiver)

  archiver ships as an ESM-only package (package.json "type": "module", no
  CJS entry). The main process bundle is CommonJS, so the top-level import
  of archiver compiled to a plain require() that threw ERR_REQUIRE_ESM the
  instant the app started, before any window was ever created — on every
  platform, not just some. This had been silently shipping broken since
  0.1.53 introduced the archiver-based zip rewrite; a running process and a
  clean log aren't enough to confirm a launch actually worked, only an
  actual rendered window is.

  Fixed by loading archiver via a dynamic import() inside zipDirectory()
  instead of a static top-level import — dynamic import() can load an ESM
  module from a CommonJS caller where require() cannot, and doing it lazily
  inside the function means it only runs when a folder actually needs
  zipping, not on every app launch.
