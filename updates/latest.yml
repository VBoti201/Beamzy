releaseDate: '2026-08-26T13:55:19.397Z'
releaseNotes: |-
  Replace LAN deviceId-as-credential with per-peer HMAC-signed requests

  deviceId was broadcast in cleartext over mDNS, so it was never actually
  secret — anyone on the same LAN could read a target's approved deviceId
  and simply claim to be it in a requesterId query param, since that was
  the only thing gating access to a device's shared folders. Every LAN
  transfer-server request now instead has to prove possession of a random
  per-peer secret exchanged out-of-band at approval time (new /api/lan-pair
  endpoint, rate-limited and TOFU-bound), verified via a timestamped,
  replay-protected HMAC signature (lanAuth.ts).

  Existing approved LAN pairs self-heal automatically the first time either
  side talks to the other after both have updated — no manual re-pairing
  needed. Both machines in a pair do need to be on this version or newer
  before LAN transfers between them will work again.
