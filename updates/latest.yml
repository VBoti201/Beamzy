releaseDate: '2026-08-26T13:00:32.156Z'
releaseNotes: >-
  Fix second-audit findings: history-delete auth, relay peer-spoof, code-binding
  lockout


  - history-delete endpoint now requires an approved LAN device, matching
    the other transfer endpoints
  - relay pulls now verify upload-start comes from the peer that was
    actually asked, closing a transferId-guessing spoof window
  - relay's deviceId-to-code binding now expires after 24h of inactivity
    instead of being permanent, so an attacker who squats a victim's
    deviceId can no longer lock them out until the next redeploy
