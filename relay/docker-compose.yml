services:
  swiftsend-relay:
    build: .
    restart: unless-stopped
    # Only exposed on localhost — Caddy (see Caddyfile.example) terminates
    # TLS and reverse-proxies to this port. Do not publish 8787 directly to
    # 0.0.0.0 in production; keep it behind a TLS-terminating proxy.
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      - PORT=8787
